    helpdesk:      {dropout: 0.2, embedding_dim: 32, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.9162
    sepsis:        {dropout: 0.3, embedding_dim: 64, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.8313
    bpic2013-incidents: {dropout: 0.2, embedding_dim: 64, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.8364
    bpic2020-domestic: {dropout: 0.2, embedding_dim: 64, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.8974
    dev1-bloom:    {dropout: 0.3, embedding_dim: 32, lr: 0.0005, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.7501
    dev1-section:  {dropout: 0.2, embedding_dim: 32, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.5852
    dev1-resource: {dropout: 0.3, embedding_dim: 32, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.5088
    bpi-2012:      {dropout: 0.2, embedding_dim: 64, lr: 0.001, num_blocks: 2, num_heads: 2}   # val NDCG@5 = 0.9334
