    helpdesk:      {dropout: 0.2, embedding_dim: 128, lr: 0.0005, num_layers: 1, hidden_dim: 128}   # val NDCG@5 = 0.9168
    sepsis:        {dropout: 0.3, embedding_dim: 128, lr: 0.0005, num_layers: 1, hidden_dim: 128}   # val NDCG@5 = 0.8433
    bpic2013-incidents: {dropout: 0.2, embedding_dim: 128, lr: 0.001, num_layers: 1, hidden_dim: 128}   # val NDCG@5 = 0.8347
    bpic2020-domestic: {dropout: 0.2, embedding_dim: 128, lr: 0.001, num_layers: 1, hidden_dim: 128}   # val NDCG@5 = 0.8961
